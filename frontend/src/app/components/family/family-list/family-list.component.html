<div class="list row">
  <div class="col-md-6">
    <h4>Family List</h4>
    <ul class="list-group">
      <li
        class="list-group-item"
        *ngFor="let family of families; let i = index"
        [class.active]="i == currentIndex"
        (click)="setActiveWish(family, i)"
      >
        {{ family.name }}
      </li>
    </ul>
  </div>
  <div class="col-md-6">
    <app-family-details
      [viewMode]="true"
      [currentFamily]="currentFamily"
    ></app-family-details>
  </div>
</div>
