<div>
  <div class="submit-form">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" fxLayout="column" *ngIf="!success">
      <mat-form-field>
        <mat-label>Username</mat-label>
        <input matInput type="text" [formControlName]="'username'">
        <mat-error *ngIf="form.controls['username'].hasError('required')">
          Field is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput type="password" [formControlName]="'password'" [placeholder]="'Password'">
        <mat-error *ngIf="form.controls['password'].hasError('required')">
          Field is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Email Address</mat-label>
        <input matInput type="email" [formControlName]="'email'" [placeholder]="'Email'">
        <mat-error *ngIf="form.controls['email'].hasError('required')">
          Field is required.
        </mat-error>
        <mat-error *ngIf="form.controls['email'].hasError('email')">
          Not an email...
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>First Name</mat-label>
        <input matInput type="text" [formControlName]="'firstName'" [placeholder]="'First Name'">
        <mat-error *ngIf="form.controls['firstName'].hasError('required')">
          Field is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Last Name</mat-label>
        <input matInput type="text" [formControlName]="'lastName'" placeHolder="Last Name">
        <mat-error *ngIf="form.controls['lastName'].hasError('required')">
          Field is required.
        </mat-error>
      </mat-form-field>

      <br>

      <button type="submit" mat-raised-button color="primary" class="btn btn-success register" [disabled]="!form.valid">Register</button>

      <div class="alert alert-warning" *ngIf="errorMessage">
        Signup failed!<br />{{ errorMessage }}
      </div>
    </form>

    <div class="alert alert-success" *ngIf="success">
      Your registration is successful!
    </div>
  </div>
</div>
